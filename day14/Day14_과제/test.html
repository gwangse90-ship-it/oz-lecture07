
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>자바스크립트 계산기</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
      background-color: #f4f4f4;
    }

    input, select, button {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>사칙연산 계산기</h1>

  <input id="num1" type="number" placeholder="첫 번째 숫자">

  <select id="operator">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">×</option>
    <option value="/">÷</option>
  </select>

  <input id="num2" type="number" placeholder="두 번째 숫자">

  <button id="calculate">계산하기</button>

  <p>결과: <span id="result">0</span></p>

  <script>
    // 1. 계산 함수
    function calculate(a, operator, b) {
      if (operator === "+") {
        return a + b;
      } else if (operator === "-") {
        return a - b;
      } else if (operator === "*") {
        return a * b;
      } else if (operator === "/") {
        if (b === 0) {
          return "0으로 나눌 수 없습니다.";
        }
        return a / b;
      } else {
        return "잘못된 연산입니다.";
      }
    }

    // 2. 계산 버튼 가져오기
    const button = document.querySelector("#calculate");

    // 3. 버튼을 클릭하면 실행
    button.addEventListener("click", function () {
      const a = Number(document.querySelector("#num1").value);
      const operator = document.querySelector("#operator").value;
      const b = Number(document.querySelector("#num2").value);

      const result = calculate(a, operator, b);

      document.querySelector("#result").textContent = result;
    });
  </script>
</body>
</html>
