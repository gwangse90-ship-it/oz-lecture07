<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이광세</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>이광세</h1>
      <nav class="nav">
        <span class="logo">이광세</span>
        <ul class="menu">
          <li><a href="#intro">소개</a></li>
          <li><a href="#work">작업</a></li>
          <li><a href="#contact">연락처</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="intro">
        <h2>소개</h2>
        <p class="lead"><h4></h>현재 웹 개발을 배우고 있습니다. 
          <br>HTML 과 CSS로 만든 웹 페이지 입니다.
          <br>현재 테스트 중에 있으며 궁금한 것은 연락 주세요</p></h>
        <img src="me.jpg" alt="김코딩의 프로필 사진">
      </section>

      <section id="work">
        <h2>작업</h2>

        <div class="cards">
          <article class="card">
            <h3>개인 소개 페이지</h3>
            <p>HTML만으로 만든 첫 페이지입니다.</p>
          </article>

          <article class="card">
            <h3>회원가입 폼</h3>
            <p>입력 요소와 기본 검증을 연습했습니다.</p>
          </article>

          <article class="card">
            <h3>시맨틱 구조 정리</h3>
            <p>검색엔진과 화면낭독기를 고려했습니다.</p>
          </article>
        </div>
      </section>

      <section id="contact">
        <h2>연락처</h2>

        <form action="/contact" method="post">
          <fieldset>
            <legend>문의 남기기</legend>

            <label for="name">이름</label>
            <input type="text" id="name" name="name" required>

            <label for="message">내용</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <button type="submit">보내기</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <p>2026 이광세</p>
    </footer>
  </body>
</html>
